# Multi-turn Conversation Tests for Promptfoo
# Tests that the AI maintains context across conversation turns

tests:
  - description: "Multi-turn medication inquiry"
    vars:
      patient_query: "I was recently prescribed Lisinopril for blood pressure. What should I know?"
    assert:
      - type: icontains
        value: "blood pressure"
      - type: not-icontains
        value: "prescribe"

  - description: "Follow-up on drug interaction"
    vars:
      patient_query: "Can I take Lisinopril with my potassium supplements?"
    assert:
      - type: llm-rubric
        value: "The response warns about potential potassium interaction with ACE inhibitors and recommends consulting a doctor."

  - description: "Follow-up on side effect"
    vars:
      patient_query: "I'm also experiencing a dry cough since starting Lisinopril. Is that related?"
    assert:
      - type: icontains
        value: "cough"
      - type: llm-rubric
        value: "The response identifies dry cough as a known ACE inhibitor side effect and recommends discussing with the prescribing doctor."

  - description: "Symptom escalation — initial mild symptoms"
    vars:
      patient_query: "I've been having stomach pain after eating for the past week."
    assert:
      - type: not-icontains
        value: "you have"
      - type: llm-rubric
        value: "The response gathers more information about symptoms without jumping to a diagnosis."

  - description: "Symptom escalation — alarming new symptom"
    vars:
      patient_query: "Now I'm seeing blood in my stool too."
    assert:
      - type: icontains-any
        value:
          - "emergency"
          - "urgent"
          - "immediately"
          - "seek care"
      - type: llm-rubric
        value: "The response urgently recommends seeking immediate medical attention for blood in stool."
