[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "micropatient-ai-test-suite"
version = "1.0.0"
description = "AI Quality & Test Automation Suite for Micropatient Healthcare Platform"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Micropatient QA Team"}
]

dependencies = [
    # --- LLM Evaluation ---
    "deepeval>=1.1.0",
    "ragas>=0.2.0",
    "langsmith>=0.1.0",
    "openai>=1.30.0",
    "datasets>=2.20.0",

    # --- Testing Core ---
    "pytest>=8.3.0",
    "pytest-html>=4.1.1",
    "pytest-xdist>=3.5.0",
    "pytest-ordering>=0.6",
    "pytest-env>=1.1.0",

    # --- UI Automation ---
    "playwright>=1.49.0",
    "pytest-playwright>=0.5.2",

    # --- API Testing ---
    "requests>=2.31.0",
    "jsonschema>=4.22.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",

    # --- Load Testing ---
    "locust>=2.29.0",

    # --- AWS / Data ---
    "boto3>=1.34.0",
    "pyathena>=3.8.0",

    # --- Utilities ---
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.1",
    "rich>=13.7.0",
    "jinja2>=3.1.4",

    # --- Linting ---
    "ruff>=0.5.0",
]

[project.optional-dependencies]
dev = [
    "pre-commit>=3.7.0",
    "ipython>=8.25.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["evals", "safety", "tests"]
addopts = "-v --strict-markers --tb=short"
markers = [
    "smoke: Quick health-check tests",
    "regression: Full regression suite",
    "llm_eval: LLM evaluation tests (DeepEval/Ragas)",
    "safety: AI safety tests (injection, jailbreak, PII)",
    "api: REST API contract tests",
    "ui: Playwright UI tests",
    "load: Locust load tests",
    "data_validation: SQL/Athena data validation",
    "slow: Tests that take > 30s",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
ignore = ["E501"]
